<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบสมาชิก</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00c300;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #login-container, #form-container { 
      display: none; 
      animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 { color: #333; margin-top: 0; margin-bottom: 20px;}
    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; color: #444; font-size: 14px; font-weight: 600; }
    
    input[type="text"], input[type="password"], input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    input:focus { 
      background-color: #ffffff;
      border-color: #00c300; 
      outline: none; 
      box-shadow: 0 0 0 4px rgba(0, 195, 0, 0.1);
    }
    
    button {
      background-color: #00c300;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Sarabun', sans-serif;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 195, 0, 0.2);
    }
    button:hover { background-color: #00b300; transform: translateY(-1px); }
    button:disabled { background-color: #cccccc; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .text-link {
      display: inline-block;
      margin-top: 20px;
      color: #00c300;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
    .error-text { color: #ef4444; font-size: 14px; margin-top: 15px; }

    /* โปรไฟล์โชว์ตอนสมัครด้วย LINE */
    .profile-img-container {
      margin: -70px auto 15px; width: 80px; height: 80px; border-radius: 50%;
      background-color: #fff; padding: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: none; 
    }
    .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #00c300; }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <!-- 1. ส่วนโหลดข้อมูล -->
    <div id="loading-container">
      <div class="loader" id="loader-spinner"></div>
      <div id="status-text" style="font-size: 18px; color: #333; font-weight: 600;">กำลังตรวจสอบระบบ...</div>
      <div id="error-msg" class="error-text"></div>
    </div>

    <!-- 2. ฟอร์มเข้าสู่ระบบ (สำหรับเปิดบน PC) -->
    <div id="login-container">
      <h2>เข้าสู่ระบบ (PC)</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUser" placeholder="ชื่อผู้ใช้งาน" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="รหัสผ่าน" required>
        </div>
        <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
        <div id="login-error" class="error-text"></div>
        <div class="text-link" onclick="toggleForms('register')">ยังไม่มีบัญชี? สมัครสมาชิก</div>
      </form>
    </div>

    <!-- 3. ฟอร์มลงทะเบียน -->
    <div id="form-container">
      <div class="profile-img-container" id="profileBox">
        <img id="profileImage" class="profile-img" src="" alt="Profile">
      </div>
      <h2>สมัครสมาชิกใหม่</h2>
      <form id="regForm">
        <!-- บัญชีผู้ใช้ -->
        <div class="form-group">
          <label>Username (สำหรับเข้าสู่ระบบ)</label>
          <input type="text" id="regUser" placeholder="ตั้งชื่อผู้ใช้งาน" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="ตั้งรหัสผ่าน" required>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- ข้อมูลส่วนตัว -->
        <div class="form-group">
          <label>ชื่อจริง</label>
          <input type="text" id="firstName" placeholder="กรอกชื่อจริง" required>
        </div>
        <div class="form-group">
          <label>นามสกุล</label>
          <input type="text" id="lastName" placeholder="กรอกนามสกุล" required>
        </div>
        <div class="form-group">
          <label>หมายเลขโทรศัพท์</label>
          <input type="tel" id="phone" placeholder="เช่น 0812345678" pattern="[0-9]{9,10}" required>
        </div>
        <button type="submit" id="submitBtn">ลงทะเบียนและเข้าสู่ระบบ</button>
        <div id="form-error" class="error-text"></div>
        <div class="text-link" id="backToLoginLink" onclick="toggleForms('login')" style="display:none;">กลับไปหน้าเข้าสู่ระบบ</div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    const LIFF_ID = "2009256913-60X6COKd"; 
    // TODO: ใส่ URL ของ Google Apps Script อันใหม่ หลังจาก Deploy สิทธิ์เป็น 'ทุกคน (Anyone)'
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwX2TO8AyPEiTgvYkDatYFXGbnn9ocHUrgXK3Wrhm_VnaT3P-q3N18ZtKekFldyQE2v0g/exec";
    // ==========================================

    let currentUserLineId = "";
    let currentDisplayName = "";
    let currentPictureUrl = "";

    window.onload = function() {
      // ตรวจสอบ LIFF
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          // ถ้าล็อกอิน LINE อยู่ (เช่นเปิดผ่านแอป LINE)
          document.getElementById('status-text').innerText = "กำลังตรวจสอบบัญชี LINE...";
          liff.getProfile().then(profile => {
            currentUserLineId = profile.userId;
            currentDisplayName = profile.displayName || "";
            currentPictureUrl = profile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            
            checkLineIdWithAPI(currentUserLineId); 
          }).catch(err => showError("ไม่สามารถดึงข้อมูลโปรไฟล์ได้", err.message));
        } else {
          // ถ้าเปิดในคอม (ไม่ล็อกอิน LINE) โชว์ฟอร์มล็อกอิน PC
          document.getElementById('loading-container').style.display = 'none';
          document.getElementById('login-container').style.display = 'block';
          document.getElementById('backToLoginLink').style.display = 'inline-block'; // เปิดปุ่มกลับไปหน้า Login
        }
      }).catch(err => {
        // ถ้าระบบ LIFF พัง ก็ให้เปิดฟอร์ม Login PC เป็นค่าเริ่มต้น
        document.getElementById('loading-container').style.display = 'none';
        document.getElementById('login-container').style.display = 'block';
        document.getElementById('backToLoginLink').style.display = 'inline-block';
      });
    };

    // สลับหน้าจอ Login กับ Register
    function toggleForms(target) {
      document.getElementById('login-error').innerText = "";
      document.getElementById('form-error').innerText = "";
      if (target === 'register') {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('form-container').style.display = 'block';
      } else {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('login-container').style.display = 'block';
      }
    }

    // 1. เช็ค LINE ID (กรณีกดจากมือถือ)
    function checkLineIdWithAPI(lineId) {
      fetch(`${GAS_API_URL}?lineId=${lineId}&nocache=${new Date().getTime()}`)
        .then(res => res.json())
        .then(data => {
          if (data.isRegistered) {
            document.getElementById('status-text').innerText = "เข้าสู่ระบบอัตโนมัติ...";
            window.location.replace(data.redirectUrl);
          } else {
            // ไม่พบข้อมูลในระบบ โชว์หน้าสมัคร พร้อมรูปโปรไฟล์
            document.getElementById('loading-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('profileBox').style.display = 'block';
            document.getElementById('profileImage').src = currentPictureUrl;
            document.getElementById('mainCard').style.marginTop = '60px'; // ดันการ์ดลงรับรูป
          }
        }).catch(err => showError("เซิร์ฟเวอร์ขัดข้อง", err.message));
    }

    // 2. ฟังก์ชันเข้าสู่ระบบผ่าน PC
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.innerText = "กำลังเข้าสู่ระบบ...";

      const payload = {
        action: 'login',
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value
      };

      // ✨✨✨ แก้ไข: ใช้ URLSearchParams แทน JSON เพื่อหลบเลี่ยง CORS 100% ✨✨✨
      fetch(GAS_API_URL, {
        method: 'POST',
        body: new URLSearchParams(payload)
      }).then(res => res.json()).then(data => {
        if (data.success) {
          window.location.replace(data.redirectUrl);
        } else {
          btn.disabled = false; btn.innerText = "เข้าสู่ระบบ";
          document.getElementById('login-error').innerText = data.error;
        }
      }).catch(err => {
        btn.disabled = false; btn.innerText = "เข้าสู่ระบบ";
        document.getElementById('login-error').innerText = "เซิร์ฟเวอร์ปฏิเสธการเชื่อมต่อ (กรุณาเช็คสิทธิ์การ Deploy เป็น 'ทุกคน')";
      });
    });

    // 3. ฟังก์ชันลงทะเบียน
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault(); 
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerText = "กำลังบันทึกข้อมูล...";
      
      const rawPhone = document.getElementById('phone').value;
      const cleanPhone = rawPhone.replace(/\D/g, '');

      const payload = {
        action: 'register',
        lineId: currentUserLineId,
        username: document.getElementById('regUser').value,
        password: document.getElementById('regPass').value,
        displayName: currentDisplayName,
        pictureUrl: currentPictureUrl,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        phone: cleanPhone
      };

      // ✨✨✨ แก้ไข: ใช้ URLSearchParams แทน JSON เพื่อหลบเลี่ยง CORS 100% ✨✨✨
      fetch(GAS_API_URL, {
        method: 'POST',
        body: new URLSearchParams(payload)
      }).then(res => res.json()).then(data => {
        if (data.success) {
          btn.innerText = "สำเร็จ! กำลังเข้าสู่ระบบ...";
          window.location.replace(data.redirectUrl);
        } else {
          btn.disabled = false; btn.innerText = "ลงทะเบียนและเข้าสู่ระบบ";
          document.getElementById('form-error').innerText = data.error;
        }
      }).catch(err => {
        btn.disabled = false; btn.innerText = "ลงทะเบียนและเข้าสู่ระบบ";
        document.getElementById('form-error').innerText = "เซิร์ฟเวอร์ปฏิเสธการเชื่อมต่อ (กรุณาเช็คสิทธิ์การ Deploy เป็น 'ทุกคน')";
      });
    });

    function showError(title, detail) {
      document.getElementById('loader-spinner').style.display = 'none';
      document.getElementById('status-text').innerText = title;
      document.getElementById('error-msg').innerText = detail;
    }
  </script>
</body>
</html>
